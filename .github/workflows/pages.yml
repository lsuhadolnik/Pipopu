name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'windows/**'
      - 'CHANGELOG.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  windows-download:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Windows download and update manifest
        shell: pwsh
        run: |
          dotnet publish windows/Pipopu/Pipopu.csproj -p:PublishProfile=Windows-x64 -o "$env:RUNNER_TEMP/pipopu"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = "$env:RUNNER_TEMP/windows-download"
          New-Item -ItemType Directory -Path "$stage/download" -Force | Out-Null
          Copy-Item "$env:RUNNER_TEMP/pipopu/Pipopu.exe" "$stage/download/Pipopu.exe"
          $exe = Get-Item "$stage/download/Pipopu.exe"
          $version = ([xml](Get-Content windows/Pipopu/Pipopu.csproj -Raw)).Project.PropertyGroup.Version
          @{
            version = $version
            sha256 = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $exe.Length
          } | ConvertTo-Json | Set-Content "$stage/update.json" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-download
          path: ${{ runner.temp }}/windows-download
          if-no-files-found: error
          compression-level: 0

  package:
    needs: windows-download
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-download
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
